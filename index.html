<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>一束阳光</title>
    <!-- 引入 FontAwesome 图标库与 QRCode.js 二维码库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; scroll-behavior: smooth; }
        
        /* 尊贵金色流光背景 */
        .bg-ambient {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;
            background-color: #fffbeb; transition: background-color 0.5s ease;
        }
        body.dark .bg-ambient { background-color: #0c0a09; }
        
        .bg-orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.75; will-change: transform;
            animation: floatOrb 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orb-1 { width: 55vw; height: 55vw; background: #fef08a; top: -15%; left: -10%; animation-duration: 20s; }
        .orb-2 { width: 60vw; height: 60vw; background: #f59e0b; bottom: -20%; right: -10%; animation-duration: 26s; }
        .orb-3 { width: 45vw; height: 45vw; background: #d97706; top: 35%; left: 30%; animation-duration: 30s; }

        body.dark .orb-1 { background: #451a03; opacity: 0.5; }
        body.dark .orb-2 { background: #78350f; opacity: 0.45; }
        body.dark .orb-3 { background: #92400e; opacity: 0.4; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(5vw, 6vh) scale(1.1) rotate(10deg); }
            100% { transform: translate(-5vw, -5vh) scale(0.95) rotate(-10deg); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            color: #292524; display: flex; flex-direction: column; min-height: 100vh; align-items: center;
            padding: 40px 24px env(safe-area-inset-bottom); overflow-x: hidden; position: relative;
            transition: color 0.3s ease;
        }
        body.dark { color: #f5f5f4; }

        /* 顶部主题切换按钮 */
        .theme-toggle-corner {
            position: fixed; top: 16px; right: 24px; z-index: 1000;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border: 0.5px solid rgba(245, 158, 11, 0.3); cursor: pointer; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
        }
        body.dark .theme-toggle-corner { 
            background: rgba(30, 24, 18, 0.6); 
            border-color: rgba(245, 158, 11, 0.25); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .container { width: 100%; max-width: 1120px; }
        
        .header-area { margin-bottom: 35px; text-align: center; }
        h1 { font-size: 32px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; color: #1c1917; }
        body.dark h1 { color: #fef3c7; text-shadow: 0 2px 15px rgba(245, 158, 11, 0.3); }
        
        /* 纯 CSS 高级发光旋转太阳动效 */
        .avatar-wrapper {
            position: relative; width: 100px; height: 100px; margin: 0 auto 16px auto;
            background: radial-gradient(circle, #fef08a 0%, #f59e0b 60%, #d97706 100%);
            border-radius: 32px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.8), 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.9);
            animation: sunPulse 3s infinite alternate ease-in-out;
            overflow: hidden;
        }
        body.dark .avatar-wrapper { border-color: rgba(245, 158, 11, 0.4); }
        
        .sun-ray {
            position: absolute; width: 150px; height: 150px;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.7), transparent 60deg);
            animation: rayRotate 6s infinite linear;
        }
        .sun-icon {
            font-size: 42px; color: #ffffff; z-index: 2;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }
        @keyframes sunPulse {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
            100% { transform: scale(1.06); box-shadow: 0 0 55px rgba(251, 191, 36, 0.95); }
        }
        @keyframes rayRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .subtitle { 
            font-size: 14px; color: #78716c; margin-bottom: 24px; font-weight: 500; 
            background: rgba(255, 251, 235, 0.8); padding: 8px 18px; border-radius: 20px; 
            display: inline-block; backdrop-filter: blur(10px); border: 0.5px solid rgba(245, 158, 11, 0.2);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.08);
        }
        body.dark .subtitle { background: rgba(41, 37, 36, 0.6); color: #d7d3d0; border-color: rgba(245, 158, 11, 0.2); }
        
        /* 核心网格布局：每行 2 列 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            width: 100%;
        }

        @media (max-width: 850px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        /* 金色毛玻璃卡片模块 */
        .ios-card {
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(35px) saturate(200%); -webkit-backdrop-filter: blur(35px) saturate(200%);
            border-radius: 24px; overflow: hidden; width: 100%;
            box-shadow: 0 12px 35px rgba(245, 158, 11, 0.08), inset 0 0.5px 0 rgba(255, 255, 255, 0.9);
            border: 0.5px solid rgba(245, 158, 11, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .ios-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(245, 158, 11, 0.15);
        }
        body.dark .ios-card { 
            background: rgba(26, 21, 16, 0.65); 
            border-color: rgba(245, 158, 11, 0.25); 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4), inset 0 0.5px 0 rgba(245, 158, 11, 0.15);
        }
        
        .bookmark-wrapper { padding: 24px; width: 100%; }
        .bookmark-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 4px 8px; position: relative; user-select: none; }
        .bookmark-title { color: #1c1917; font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
        body.dark .bookmark-title { color: #fef3c7; }
        .bookmark-header i.chevron { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); color: #d97706; }
        .bookmark-header.collapsed i.chevron { transform: rotate(-90deg); }
        
        .bookmark-links { display: grid; grid-template-rows: 1fr; gap: 14px; transition: 0.35s ease; overflow: hidden; margin-top: 16px; width: 100%; position: relative; }
        .bookmark-links.collapsed { grid-template-rows: 0fr; opacity: 0; margin-top: 0; pointer-events: none; }
        .bookmark-links-inner { display: flex; flex-direction: column; gap: 14px; width: 100%; max-height: 420px; overflow-y: auto; padding-right: 18px; }
        
        .bookmark-links-inner::-webkit-scrollbar { width: 4px; }
        .bookmark-links-inner::-webkit-scrollbar-thumb { background: rgba(217, 119, 6, 0.3); border-radius: 4px; }

        /* 子卡片通用样式 */
        .software-card, .file-card { 
            background: rgba(255, 255, 255, 0.75); 
            border-radius: 14px; 
            padding: 15px 18px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 14px;
            border: 0.5px solid rgba(245, 158, 11, 0.2);
            transition: all 0.2s ease; 
        }
        body.dark .software-card, body.dark .file-card {
            background: rgba(41, 33, 24, 0.6);
            border-color: rgba(245, 158, 11, 0.2);
        }
        
        .software-info, .file-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
        .software-icon { width: 26px; height: 26px; object-fit: contain; border-radius: 6px; flex-shrink: 0; background: rgba(255,255,255,0.8); padding: 2px; border: 1px solid rgba(245, 158, 11, 0.2); }

        .text-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .software-name, .file-name { font-weight: 700; font-size: 14px; color: #1c1917; line-height: 1.4; }
        body.dark .software-name, body.dark .file-name { color: #fef3c7; }

        .tag {
            font-size: 11px; background: rgba(245, 158, 11, 0.15);
            color: #d97706; padding: 2px 8px; border-radius: 10px; font-weight: 600;
        }
        body.dark .tag { background: rgba(245, 158, 11, 0.25); color: #fcd34d; }

        .btn-group { display: flex; gap: 8px; flex-shrink: 0; }
        
        button, .btn-action { 
            padding: 8px 16px; border: none; border-radius: 9px; 
            background: #f59e0b; color: #fff; cursor: pointer; 
            font-size: 13px; font-weight: 600; transition: all 0.2s ease; 
            text-align: center; box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
            white-space: nowrap; text-decoration: none; display: inline-block;
        }
        button:hover, .btn-action:hover { background: #d97706; }
        .btn-download { background: #d69e2e !important; }
        .btn-download:hover { background: #b7791f !important; }
        .btn-success { background: #10b981 !important; box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25) !important; }
        .btn-success:hover { background: #059669 !important; }

        .link-item a {
            display: block; width: 100%; padding: 15px 18px; background: rgba(255, 255, 255, 0.75);
            border-radius: 12px; font-size: 14px; text-align: left; color: #1c1917;
            text-decoration: none; border: 0.5px solid rgba(245, 158, 11, 0.2); font-weight: 600;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.04); transition: all 0.2s;
        }
        body.dark .link-item a { color: #fef3c7; background: rgba(41, 33, 24, 0.6); border-color: rgba(245, 158, 11, 0.2); box-shadow: none; }
        
        /* 🌟 右侧 A-Z 丝滑浮动索引栏设计（带放大动效） */
        .az-index-bar {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; align-items: center; z-index: 10;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px);
            padding: 6px 3px; border-radius: 12px; border: 0.5px solid rgba(245, 158, 11, 0.2);
            user-select: none;
        }
        body.dark .az-index-bar { background: rgba(20, 16, 12, 0.5); }

        .az-item {
            font-size: 10px; font-weight: 700; color: #b45309; padding: 1px 4px;
            cursor: pointer; transition: transform 0.15s ease, color 0.15s ease;
        }
        body.dark .az-item { color: #fcd34d; }
        
        .az-item.active, .az-item:hover {
            transform: scale(1.6);
            color: #ef4444;
            text-shadow: 0 0 8px rgba(245, 158, 11, 0.8);
        }

        /* 正在开发中提示卡片样式 */
        .dev-tip-card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            font-size: 13.5px;
            color: #78716c;
            border: 0.5px dashed rgba(245, 158, 11, 0.3);
            font-weight: 500;
        }
        body.dark .dev-tip-card {
            background: rgba(41, 33, 24, 0.4);
            color: #a8a29e;
            border-color: rgba(245, 158, 11, 0.25);
        }

        /* 二维码弹窗美化 */
        #qrcode-modal { 
            display: none; text-align: center; margin-top: 30px; padding: 30px 20px; 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border-radius: 18px; border: 1px solid rgba(245, 158, 11, 0.3); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); grid-column: 1 / -1;
        }
        body.dark #qrcode-modal { background: rgba(30, 24, 18, 0.9); border-color: rgba(245, 158, 11, 0.3); }
        
        #qrcode-container { display: inline-block; margin: 14px 0; background: #fff; padding: 14px; border-radius: 14px; border: 1px solid #e2e8f0; }
        #qrcode-container img { display: block; border-radius: 6px; }

        .qr-tip-box {
            font-size: 12.5px; font-weight: 600; color: #d97706; margin: 10px auto 18px auto; 
            background: rgba(254, 243, 199, 0.6); padding: 10px 16px; border-radius: 10px; 
            max-width: 340px; line-height: 1.5; text-align: center;
        }

        .footer-text { font-size: 12px; color: #78716c; text-align: center; padding: 40px 0 10px 0; font-weight: 500; grid-column: 1 / -1; }
        body.dark .footer-text { color: #a8a29e; }
    </style>
</head>

        // 软件导航数据
        const softwareList = [
            { name: "诗歌本", tag: "官方下载", url: "https://appsky.icu/#/hymn", icon: "https://www.google.com/s2/favicons?domain=appsky.icu&sz=64", btnText: "点击下载", borderColor: "#3b82f6" },

        ];

        // 书籍共享数据
        const fileList = [
            { name: "人如何改变：在恩典中经历蜕变的喜乐", url: "https://filebox.nnuu.nyc.mn/#/?code=6T3QL", color: "#3182ce" },

            { name: "晨恩日新", url: "https://filebox.nnuu.nyc.mn/#/?code=B5MTZ", color: "#805ad5" },
            { name: "亚伯拉罕应许和现实的落差", url: "https://filebox.nnuu.nyc.mn/#/?code=O3QSS", color: "#dd6b20" }
        ];

        // 获取首字母辅助函数
        function getFirstLetter(str) {
            if (!str) return '#';
            let firstChar = str.trim().charAt(0).toUpperCase();
            if ((firstChar >= 'A' && firstChar <= 'Z') || (firstChar >= '0' && firstChar <= '9')) {
                return firstChar;
            }
            return firstChar;
        }

        // 渲染软件列表（自动 A-Z 排序 + 右侧索引条）
        function renderSoftware() {
            const container = document.getElementById('softwareListContainer');
            const azBar = document.getElementById('softwareAzBar');
            
            softwareList.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));

            let html = '';
            let letters = new Set();

            softwareList.forEach((item) => {
                let firstLetter = getFirstLetter(item.name);
                letters.add(firstLetter);
                let btnClass = item.isWatch ? "btn-action btn-success" : "btn-action";
                html += `
                    <div class="software-card" id="soft-${firstLetter}" style="border-left: 4px solid ${item.borderColor};">
                        <div class="software-info">
                            <img src="${item.icon}" alt="" class="software-icon" onerror="this.src='https://www.google.com/s2/favicons?domain=github.com&sz=64'">
                            <div class="text-group">
                                <span class="software-name">${item.name}</span>
                                <span class="tag">${item.tag}</span>
                            </div>
                        </div>
                        <a href="${item.url}" target="_blank" class="${btnClass}">${item.btnText}</a>
                    </div>
                `;
            });
            container.innerHTML = html;

            let azHtml = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(char => {
                if (letters.has(char)) {
                    azHtml += `<div class="az-item" onmouseover="highlightAz(this, true)" onmouseout="highlightAz(this, false)" onclick="scrollToLetter('soft-${char}', this)">${char}</div>`;
                }
            });
            azBar.innerHTML = azHtml;
        }

        // 渲染书籍列表（自动 A-Z 排序 + 右侧索引条）
        function renderFiles() {
            const container = document.getElementById('fileListContainer');
            const azBar = document.getElementById('fileAzBar');

            fileList.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));

            let html = '';
            let letters = new Set();

            fileList.forEach((item) => {
                let firstLetter = getFirstLetter(item.name);
                letters.add(firstLetter);
                html += `
                    <div class="file-card" id="file-${firstLetter}" style="border-left: 4px solid ${item.color};">
                        <div class="file-info">
                            <div class="file-name">📖 ${item.name}</div>
                        </div>
                        <div class="btn-group">
                            <button class="btn-download" onclick="window.open('${item.url}', '_blank')">点击下载</button>
                            <button class="btn-success" onclick="showQr('${item.url}', '${item.name}')">二维码</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            let azHtml = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(char => {
                if (letters.has(char)) {
                    azHtml += `<div class="az-item" onmouseover="highlightAz(this, true)" onmouseout="highlightAz(this, false)" onclick="scrollToLetter('file-${char}', this)">${char}</div>`;
                }
            });
            azBar.innerHTML = azHtml;
        }

        // 滚动与高亮特效
        function scrollToLetter(targetId, el) {
            const targetEl = document.getElementById(targetId);
            const container = targetEl.closest('.bookmark-links-inner');
            if (targetEl && container) {
                container.scrollTo({
                    top: targetEl.offsetTop - container.offsetTop,
                    behavior: 'smooth'
                });
            }
            el.classList.add('active');
            setTimeout(() => el.classList.remove('active'), 400);
        }

        function highlightAz(el, isEnter) {
            if (isEnter) {
                el.classList.add('active');
            } else {
                el.classList.remove('active');
            }
        }

        // 二维码弹窗展示
        function showQr(url, name) {
            let modal = document.getElementById('qrcode-modal');
            let title = document.getElementById('qr-title');
            let container = document.getElementById('qrcode');
            
            container.innerHTML = '';
            title.innerText = `【 ${name} 】的取件二维码`;
            modal.style.display = 'block';
            
            new QRCode(container, {
                text: url,
                width: 160,
                height: 160
            });

            setTimeout(() => {
                let canvas = container.querySelector('canvas');
                if (canvas) {
                    let imgDataUrl = canvas.toDataURL("image/png");
                    container.innerHTML = `<img src="${imgDataUrl}" alt="二维码" style="width: 160px; height: 160px; display: block;" />`;
                }
            }, 50);
            
            modal.scrollIntoView({ behavior: 'smooth' });
        }

        function closeQr() {
            document.getElementById('qrcode-modal').style.display = 'none';
        }

        // 主题切换逻辑
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        toggle.onclick = () => {
            document.body.classList.toggle('dark');
            icon.innerText = document.body.classList.contains('dark') ? '🌙' : '☀️';
        };

        // 模块折叠展开逻辑
        window.toggleBookmark = (header) => {
            header.classList.toggle('collapsed');
            header.nextElementSibling.classList.toggle('collapsed');
        };

        // 页面加载完成后自动渲染
        window.onload = () => {
            renderSoftware();
            renderFiles();
        };
    </script>
</body>
</html>
