<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>一束阳光</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        /* 尊贵金色流光背景 */
        .bg-ambient {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden;
            background-color: #fffbeb; transition: background-color 0.5s ease;
        }
        body.dark .bg-ambient { background-color: #0c0a09; }
        
        .bg-orb {
            position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.75; will-change: transform;
            animation: floatOrb 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .orb-1 { width: 55vw; height: 55vw; background: #fef08a; top: -15%; left: -10%; animation-duration: 20s; }
        .orb-2 { width: 60vw; height: 60vw; background: #f59e0b; bottom: -20%; right: -10%; animation-duration: 26s; }
        .orb-3 { width: 45vw; height: 45vw; background: #d97706; top: 35%; left: 30%; animation-duration: 30s; }

        body.dark .orb-1 { background: #451a03; opacity: 0.5; }
        body.dark .orb-2 { background: #78350f; opacity: 0.45; }
        body.dark .orb-3 { background: #92400e; opacity: 0.4; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(5vw, 6vh) scale(1.1) rotate(10deg); }
            100% { transform: translate(-5vw, -5vh) scale(0.95) rotate(-10deg); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            color: #292524; display: flex; flex-direction: column; min-height: 100vh; align-items: center;
            padding: 40px 16px env(safe-area-inset-bottom); overflow-x: hidden; position: relative;
            transition: color 0.3s ease;
        }
        body.dark { color: #f5f5f4; }

        /* 顶部主题切换按钮 */
        .theme-toggle-corner {
            position: fixed; top: 16px; right: 16px; z-index: 1000;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            border: 0.5px solid rgba(245, 158, 11, 0.3); cursor: pointer; box-shadow: 0 4px 20px rgba(245, 158, 11, 0.15);
        }
        body.dark .theme-toggle-corner { 
            background: rgba(30, 24, 18, 0.6); 
            border-color: rgba(245, 158, 11, 0.25); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .container { width: 100%; max-width: 390px; }
        .header-area { margin-bottom: 24px; text-align: center; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; color: #1c1917; }
        body.dark h1 { color: #fef3c7; text-shadow: 0 2px 15px rgba(245, 158, 11, 0.3); }
        
        /* 采用精美阳光动态图的头像框 */
        .avatar-wrapper {
            position: relative; width: 94px; height: 94px; margin: 0 auto 16px auto;
            border-radius: 30px; overflow: hidden;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.8), 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.9);
            animation: sunPulse 3s infinite alternate ease-in-out;
            background: #fffbeb;
        }
        body.dark .avatar-wrapper { border-color: rgba(245, 158, 11, 0.4); }
        .avatar-img {
            width: 100%; height: 100%; object-fit: cover;
        }
        @keyframes sunPulse {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
            100% { transform: scale(1.06); box-shadow: 0 0 55px rgba(251, 191, 36, 0.95); }
        }

        .subtitle { 
            font-size: 13.5px; color: #78716c; margin-bottom: 22px; font-weight: 500; 
            background: rgba(255, 251, 235, 0.8); padding: 8px 16px; border-radius: 20px; 
            display: inline-block; backdrop-filter: blur(10px); border: 0.5px solid rgba(245, 158, 11, 0.2);
            box-shadow: 0 2px 10px rgba(245, 158, 11, 0.08);
        }
        body.dark .subtitle { background: rgba(41, 37, 36, 0.6); color: #d7d3d0; border-color: rgba(245, 158, 11, 0.2); }
        
        /* 金色高级感毛玻璃独立卡片模块 */
        .ios-card {
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(35px) saturate(200%); -webkit-backdrop-filter: blur(35px) saturate(200%);
            border-radius: 22px; margin-top: 14px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.08), inset 0 0.5px 0 rgba(255, 255, 255, 0.9);
            border: 0.5px solid rgba(245, 158, 11, 0.3);
        }
        body.dark .ios-card { 
            background: rgba(26, 21, 16, 0.6); 
            border-color: rgba(245, 158, 11, 0.25); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 0.5px 0 rgba(245, 158, 11, 0.15);
        }
        
        .bookmark-wrapper { padding: 16px; }
        .bookmark-header { display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px 0; position: relative; user-select: none; }
        .bookmark-title { color: #1c1917; font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
        body.dark .bookmark-title { color: #fef3c7; }
        .bookmark-header i.chevron { position: absolute; right: 0; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); color: #d97706; }
        .bookmark-header.collapsed i.chevron { transform: rotate(-90deg); }
        
        .bookmark-links { display: grid; grid-template-rows: 1fr; gap: 8px; transition: 0.35s ease; overflow: hidden; margin-top: 12px; }
        .bookmark-links.collapsed { grid-template-rows: 0fr; opacity: 0; margin-top: 0; pointer-events: none; }
        .bookmark-links-inner { display: flex; flex-direction: column; gap: 8px; }

        /* 内部菜单按钮 */
        .link-item a {
            display: block; padding: 12px 14px; background: rgba(255, 255, 255, 0.7);
            border-radius: 12px; font-size: 14px; text-align: center; color: #1c1917;
            text-decoration: none; border: 0.5px solid rgba(245, 158, 11, 0.2); font-weight: 600;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.04); transition: all 0.2s;
        }
        body.dark .link-item a { color: #fef3c7; background: rgba(41, 33, 24, 0.6); border-color: rgba(245, 158, 11, 0.2); box-shadow: none; }
        .link-item a:active { transform: scale(0.97); }

        .footer-text { font-size: 12px; color: #78716c; text-align: center; padding: 40px 0 10px 0; font-weight: 500; }
        body.dark .footer-text { color: #a8a29e; }
    </style>
</head>
<body>
    <div class="bg-ambient">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>
    </div>
    
    <div class="theme-toggle-corner" id="themeToggle"><span id="themeIcon">☀️</span></div>
    
    <div class="container">
        <div class="header-area">
            <h1>一束阳光</h1>
            <!-- 一束阳光动态图 -->
            <div class="avatar-wrapper">
                <img class="avatar-img" src="https://assets.mixkit.co/videos/preview/mixkit-sun-shining-through-the-trees-4318-large.mp4" onerror="this.src='https://media.giphy.com/media/3o7TKDkDbIDJieKbVm/giphy.gif'" alt="一束阳光动态图">
            </div>
            <div class="subtitle">⚠️ 注意事项：请在浏览器中打开本网站。</div>
        </div>
        
        <!-- 模块一：软件导航 -->
        <div class="ios-card">
            <div class="bookmark-wrapper">
                <div class="bookmark">
                    <div class="bookmark-header" onclick="toggleBookmark(this)">
                        <div class="bookmark-title">💻 软件导航</div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="bookmark-links">
                        <div class="bookmark-links-inner">
                            <div class="link-item"><a href="https://google.com" target="_blank">谷歌搜索</a></div>
                            <div class="link-item"><a href="https://github.com" target="_blank">GitHub 官网</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模块二：书籍共享 -->
        <div class="ios-card">
            <div class="bookmark-wrapper">
                <div class="bookmark">
                    <div class="bookmark-header" onclick="toggleBookmark(this)">
                        <div class="bookmark-title">📚 书籍共享</div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="bookmark-links">
                        <div class="bookmark-links-inner">
                            <div class="link-item"><a href="#" target="_blank">电子书库一</a></div>
                            <div class="link-item"><a href="#" target="_blank">电子书库二</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模块三：影视专区 -->
        <div class="ios-card">
            <div class="bookmark-wrapper">
                <div class="bookmark">
                    <div class="bookmark-header" onclick="toggleBookmark(this)">
                        <div class="bookmark-title">🎬 影视专区</div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="bookmark-links">
                        <div class="bookmark-links-inner">
                            <div class="link-item"><a href="#" target="_blank">在线影视网</a></div>
                            <div class="link-item"><a href="#" target="_blank">TV 电视直播</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模块四：实用工具 -->
        <div class="ios-card">
            <div class="bookmark-wrapper">
                <div class="bookmark">
                    <div class="bookmark-header" onclick="toggleBookmark(this)">
                        <div class="bookmark-title">🛠️ 实用工具</div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="bookmark-links">
                        <div class="bookmark-links-inner">
                            <div class="link-item"><a href="#" target="_blank">IP 优选工具</a></div>
                            <div class="link-item"><a href="#" target="_blank">临时邮箱服务</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模块五：常用资源 -->
        <div class="ios-card">
            <div class="bookmark-wrapper">
                <div class="bookmark">
                    <div class="bookmark-header" onclick="toggleBookmark(this)">
                        <div class="bookmark-title">📂 常用资源</div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="bookmark-links">
                        <div class="bookmark-links-inner">
                            <div class="link-item"><a href="#" target="_blank">网盘资源搜索</a></div>
                            <div class="link-item"><a href="#" target="_blank">节点订阅转换</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 模块六：关于本站 -->
        <div class="ios-card">
            <div class="bookmark-wrapper">
                <div class="bookmark">
                    <div class="bookmark-header" onclick="toggleBookmark(this)">
                        <div class="bookmark-title">✨ 关于本站</div>
                        <i class="fas fa-chevron-down chevron"></i>
                    </div>
                    <div class="bookmark-links">
                        <div class="bookmark-links-inner">
                            <div class="link-item"><a href="#" target="_blank">永久发布页说明</a></div>
                            <div class="link-item"><a href="#" target="_blank">联系站长</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    
    <p class="footer-text">© 2026 一束阳光. All Rights Reserved.</p>

    <script>
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        toggle.onclick = () => {
            document.body.classList.toggle('dark');
            icon.innerText = document.body.classList.contains('dark') ? '🌙' : '☀️';
        };
        window.toggleBookmark = (header) => {
            header.classList.toggle('collapsed');
            header.nextElementSibling.classList.toggle('collapsed');
        };
    </script>
</body>
</html>
